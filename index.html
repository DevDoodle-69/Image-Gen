<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Generation API Documentation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --secondary: #4f46e5;
            --accent: #06b6d4;
            --background: #0f172a;
            --text: #f8fafc;
            --card: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        nav {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            z-index: 100;
            padding: 1rem 0;
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px var(--primary), 0 0 20px var(--accent);
            }
            to {
                text-shadow: 0 0 15px var(--primary), 0 0 30px var(--accent);
            }
        }

        main {
            padding-top: 100px;
            flex: 1;
        }

        .hero {
            text-align: center;
            padding: 4rem 0;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .generator-card {
            background: var(--card);
            border-radius: 20px;
            padding: 2rem;
            margin: 2rem 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transform: translateY(0);
            transition: all 0.3s ease;
        }

        .generator-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        input, select {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.3);
        }

        button {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: var(--text);
            padding: 1rem 2rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .result-container {
            margin-top: 2rem;
            text-align: center;
        }

        .preview-image {
            max-width: 100%;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .preview-image:hover {
            transform: scale(1.02);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            cursor: pointer;
        }

        .modal img {
            max-width: 90%;
            max-height: 90vh;
            margin: auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .loading {
            display: none;
            text-align: center;
            margin: 2rem 0;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        footer {
            text-align: center;
            padding: 2rem 0;
            background: var(--card);
            margin-top: 4rem;
        }

        .heart {
            color: #ef4444;
            animation: beat 1s infinite;
        }

        @keyframes beat {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 1rem;
            }

            h1 {
                font-size: 2.5rem;
            }

            .generator-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="container nav-content">
            <div class="logo">NZ Image Gen</div>
            <div class="nav-links">
                <i class="fas fa-magic"></i>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="hero">
            <h1>AI Image Generation</h1>
            <p>Transform your ideas into stunning visuals with our advanced AI</p>
        </section>

        <div class="generator-card">
            <div class="input-group">
                <input type="text" id="promptInput" placeholder="Describe your image..." autocomplete="off">
            </div>

            <div class="input-group">
                <select id="modelSelect">
                    <option value="1">Flux Schnell - Fast & Creative</option>
                    <option value="2">Imagen 3 Fast - Balanced</option>
                    <option value="3">Imagen 3 - High Quality</option>
                    <option value="4">Recraft V3 - Artistic</option>
                </select>
            </div>

            <div class="input-group">
                <select id="ratioSelect">
                    <option value="1">Square (1:1)</option>
                    <option value="2">Landscape (16:9)</option>
                    <option value="3">Portrait (9:16)</option>
                    <option value="4">Classic (3:2)</option>
                    <option value="5">Standard (4:3)</option>
                    <option value="6">Wide (5:4)</option>
                </select>
            </div>

            <button onclick="generateImage()">
                <i class="fas fa-wand-magic-sparkles"></i> Generate Image
            </button>

            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Creating your masterpiece...</p>
            </div>

            <div class="result-container" id="result"></div>
        </div>
    </main>

    <div class="modal" id="imageModal" onclick="closeModal()">
        <img id="modalImage" src="" alt="Full size preview">
    </div>

    <footer>
        <p>Made With <span class="heart">♥️</span> By NZ R</p>
    </footer>

    <script>
        async function generateImage() {
            const prompt = document.getElementById('promptInput').value;
            const model = document.getElementById('modelSelect').value;
            const ratio = document.getElementById('ratioSelect').value;
            const loading = document.querySelector('.loading');
            const resultDiv = document.getElementById('result');

            if (!prompt) {
                alert('Please enter a description for your image');
                return;
            }

            loading.style.display = 'block';
            resultDiv.innerHTML = '';

            try {
                const response = await fetch(`/image?prompt=${encodeURIComponent(prompt)}&model=${model}&ratio=${ratio}`);
                const data = await response.json();

                if (data.output) {
                    const img = document.createElement('img');
                    img.src = data.output;
                    img.classList.add('preview-image');
                    img.onclick = () => openModal(data.output);
                    resultDiv.appendChild(img);
                } else {
                    resultDiv.innerHTML = '<p>Failed to generate image</p>';
                }
            } catch (error) {
                resultDiv.innerHTML = '<p>Error generating image</p>';
            } finally {
                loading.style.display = 'none';
            }
        }

        function openModal(imageSrc) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modal.style.display = 'block';
            modalImg.src = imageSrc;
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
